name: Lernaktivitaet synchronisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sync_notion.py'
      - '.github/workflows/heatmap.yml'
  schedule:
    - cron: '17 5 * * *' # taeglich 05:17 UTC

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Notion-Tageswerte berechnen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python sync_notion.py --output _site/activity.json

      - name: Heatmap-Webseite bereitstellen
        run: cp index.html _site/index.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webseite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Webseite veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
